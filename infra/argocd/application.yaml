apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pdp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/gdlopes/pdp-backend.git
    targetRevision: HEAD
    path: infra/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: pdp
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
