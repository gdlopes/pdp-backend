apiVersion: batch/v1
kind: Job
metadata:
  name: pdp-api-migration
  namespace: pdp
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done
      containers:
        - name: migrate
          image: gdlopes/pdp-backend:latest
          imagePullPolicy: Always
          command: ['npm', 'run', 'migration:run:prod']
          envFrom:
            - configMapRef:
                name: pdp-api-config
            - secretRef:
                name: pdp-api-secret
